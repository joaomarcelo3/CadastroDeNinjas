<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhe da Missão</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 24px;
            background: #f3f5fa;
            color: #263248;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .card {
            padding: 32px;
            background: #fff;
            border: 1px solid #e4e9f2;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(25, 42, 70, 0.06);
        }

        .rank {
            display: inline-block;
            padding: 6px 12px;
            background: #eef2ff;
            color: #4f46e5;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .dados {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 0;
        }

        .dado dt {
            margin-bottom: 6px;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .dado dd {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            color: #4f46e5;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .voltar:hover {
            color: #4338ca;
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 12px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<main class="container">
    <h1>Detalhes da Missão</h1>

    <section class="card">
        <dl class="dados">
            <div class="dado">
                <dt>Nome</dt>
                <dd th:text="${missao.nome}"></dd>
            </div>
            <div class="dado">
                <dt>Dificuldade</dt>
                <dd><span class="rank" th:text="${missao.dificuldade}"></span></dd>
            </div>
        </dl>
    </section>

    <a th:href="@{/missoes/ui/listar}" class="voltar">Voltar para a lista de missões</a>
</main>
</body>
</html>
