<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adicionar Ninja</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 24px;
            background: #f3f5fa;
            color: #263248;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .form-ninja {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 32px;
            background: #fff;
            border: 1px solid #e4e9f2;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(25, 42, 70, 0.06);
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .campo label {
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .campo input {
            width: 100%;
            min-height: 46px;
            padding: 11px 14px;
            background: #f8faff;
            color: #263248;
            border: 1px solid #e4e9f2;
            border-radius: 8px;
            font: inherit;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .campo input:hover {
            border-color: #c7d2fe;
        }

        .campo input:focus {
            outline: none;
            background: #fff;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.35);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            margin-top: 8px;
            padding: 10px 18px;
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #4338ca;
        }

        .mensagem {
            margin-bottom: 20px;
            padding: 14px 18px;
            background: #eef2ff;
            color: #4338ca;
            border: 1px solid #c7d2fe;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            color: #4f46e5;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .voltar:hover {
            color: #4338ca;
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 12px;
            }

            .form-ninja {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<main class="container">
    <h1>Adicionar Novo Ninja</h1>

    <div th:if="${mensagem}" class="mensagem" th:text="${mensagem}"></div>

    <form th:action="@{/ninjas/ui/salvar}" th:object="${ninja}" method="post" class="form-ninja">
        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" required>
        </div>

        <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" required>
        </div>

        <div class="campo">
            <label for="imgUrl">URL da Imagem</label>
            <input type="text" id="imgUrl" th:field="*{imgUrl}" required>
        </div>

        <div class="campo">
            <label for="idade">Idade</label>
            <input type="number" id="idade" th:field="*{idade}" required>
        </div>

        <div class="campo">
            <label for="rank">Rank</label>
            <input type="text" id="rank" th:field="*{rank}" required>
        </div>

        <button type="submit" class="btn">Cadastrar Ninja</button>
    </form>

    <a th:href="@{/ninjas/ui/listar}" class="voltar">Voltar para a lista de ninjas</a>
</main>
</body>
</html>
