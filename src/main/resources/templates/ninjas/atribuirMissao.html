<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atribuir Missão</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 24px;
            background: #f3f5fa;
            color: #263248;
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            width: 100%;
            max-width: 500px;
            padding: 32px;
            background: #fff;
            border: 1px solid #e4e9f2;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(25, 42, 70, 0.06);
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .subtitle {
            margin: 0 0 24px 0;
            color: #64748b;
            font-size: 14px;
        }

        .ninja-box {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            margin-bottom: 24px;
            background: #f8faff;
            border: 1px solid #e4e9f2;
            border-radius: 12px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border: 3px solid #eef2ff;
            border-radius: 50%;
        }

        .ninja-name {
            margin: 0 0 6px 0;
            font-size: 16px;
            font-weight: 700;
        }

        .rank {
            display: inline-block;
            padding: 4px 10px;
            background: #eef2ff;
            color: #4f46e5;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #263248;
            font-size: 14px;
            font-weight: 600;
        }

        select {
            width: 100%;
            min-height: 44px;
            padding: 10px 14px;
            background: #fff;
            color: #263248;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px #eef2ff;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 10px 18px;
            border: 1px solid transparent;
            border-radius: 8px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:focus-visible {
            outline: 3px solid #818cf8;
            outline-offset: 3px;
        }

        .btn-secondary {
            background: #eef2ff;
            color: #4338ca;
        }

        .btn-secondary:hover {
            background: #e0e7ff;
        }

        .btn-primary {
            background: #4f46e5;
            color: #fff;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        @media (prefers-reduced-motion: reduce) {
            .btn {
                transition: none;
            }

            .btn:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
<main class="card">

    <h1>Atribuir missão</h1>
    <p class="subtitle">Escolha uma missão para vincular a este ninja.</p>

    <div class="ninja-box">
        <img class="avatar" th:src="${ninja.imgUrl}" th:alt="${ninja.nome}">
        <div>
            <p class="ninja-name" th:text="${ninja.nome}"></p>
            <span class="rank" th:text="${ninja.rank}"></span>
        </div>
    </div>

    <form th:action="@{/ninjas/ui/atribuir-missao}" method="post">
        <input type="hidden" name="ninjaId" th:value="${ninja.id}">

        <div class="form-group">
            <label for="missao">Missão disponível</label>
            <select id="missao" name="missaoId">
                <option value="">-- Selecione uma missão --</option>
                <option th:each="missao : ${missoes}"
                        th:value="${missao.id}"
                        th:text="${missao.nome} + ' — Dificuldade: ' + ${missao.dificuldade}"
                        th:selected="${ninja.missoes != null and ninja.missoes.id == missao.id}">
                <option value="">-- Remover missão --</option>
                </option>
            </select>
        </div>

        <div class="actions">
            <a class="btn btn-secondary" th:href="@{/ninjas/ui/listar}">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar missão</button>
        </div>
    </form>

</main>
</body>
</html>
